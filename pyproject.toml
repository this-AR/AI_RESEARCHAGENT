[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Multi-agent company research and outreach pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AI Research Agent contributors"}]
dependencies = [
    "crewai[tools]>=0.100,<2",
    "ddgs>=9,<10",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.3,<1",
    "black>=24.0,<25",
    "mypy>=1.9,<2",
    "streamlit>=1.30,<2",
]

[project.scripts]
research-agent = "ai_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
