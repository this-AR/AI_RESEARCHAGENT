[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Multi-agent company research and outreach pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AI Research Agent contributors"}]
dependencies = [
    "crewai[tools]>=0.100,<2",
    "ddgs>=9,<10",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
research-agent = "ai_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
